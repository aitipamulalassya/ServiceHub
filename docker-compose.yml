services:

  server:
    build:
      context: ./server
    container_name: servicehub-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://host.docker.internal:27017/servicehub
      JWT_SECRET: servicehub_super_secret_key
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: servicehub-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server